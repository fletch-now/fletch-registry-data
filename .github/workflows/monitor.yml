name: Public Registry monitor

on:
  push:
    paths:
      - ".github/workflows/monitor.yml"
      - "scripts/monitor.mjs"
      - "test/monitor.test.mjs"
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-registry-monitor
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check the monitor fixtures
        run: node --test test/monitor.test.mjs
      - name: Observe public status and Markets
        run: node scripts/monitor.mjs
      - name: Preserve observations including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: monitor-artifacts/*.json
          retention-days: 30
          if-no-files-found: error
