name: Snapshot

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # This job can push; no dependency here needs a lifecycle script, so
      # none gets to run with the token in scope.
      - run: npm ci --ignore-scripts
      - run: npm run snapshot
      # verify exits 1 only when a beacon slot points somewhere other than the
      # registry; an RPC timeout is recorded as unread and exits 0. A mismatch
      # is committed to data/verify.json as evidence first, and the last step
      # then fails the run so it is noticed.
      - id: verify
        run: npm run verify
        continue-on-error: true
      - run: npm test
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data tokenlist.json
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "snapshot $(date -u +%Y-%m-%d)"
          git push
      - if: steps.verify.outcome == 'failure'
        run: |
          echo "a canonical proof failed; see data/verify.json"
          exit 1
